" font-size="16" font-weight="700" fill="#252525">Скасувати</text><rect x="527" y="555" width="386" height="91" rx="7" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/><text x="541" y="580" font-size="16" font-weight="700" fill="#252525">Місце для повідомлення про поле</text><text x="541" y="606" font-size="15" font-weight="400" fill="#252525">Наприклад: «Укажіть дисципліну».</text><text x="541" y="630" font-size="15" font-weight="400" fill="#252525">Форма залишається для виправлення.</text><text x="980" y="32" font-size="22" font-weight="700" fill="#252525">S3 · Перегляд завдання</text><rect x="980" y="53" width="430" height="617" rx="9" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="1002" y="91" font-size="22" font-weight="700" fill="#252525">Student Task Manager</text><path d="M980 111h430" stroke="#aaa"/><rect x="1002" y="132" width="185" height="42" rx="7" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="1015" y="159" font-size="16" font-weight="700" fill="#252525">← До списку</text><text x="1002" y="219" font-size="28" font-weight="700" fill="#252525">Звіт</text><text x="1002" y="258" font-size="16" font-weight="400" fill="#252525">Дисципліна</text><text x="1002" y="290" font-size="22" font-weight="700" fill="#252525">Інформатика</text><text x="1002" y="342" font-size="16" font-weight="400" fill="#252525">Дата здачі</text><text x="1002" y="374" font-size="22" font-weight="700" fill="#252525">2026-11-20</text><text x="1002" y="426" font-size="16" font-weight="400" fill="#252525">Статус</text><text x="1002" y="458" font-size="22" font-weight="700" fill="#252525">Не виконано</text><rect x="1002" y="506" width="386" height="105" rx="7" fill="#fafafa" stroke="#aaa" stroke-width="1.5"/><text x="1017" y="537" font-size="18" font-weight="700" fill="#252525">Створений запис</text><text x="1017" y="565" font-size="15" font-weight="400" fill="#252525">Значення збігаються з даними форми.</text><text x="1017" y="590" font-size="15" font-weight="400" fill="#25