<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Task Manager</title>
<style>
  :root { font: 16px/1.5 Inter, system-ui, sans-serif; color: #18243b; background: #eef2f8; }
  body { margin: 0; }
  main { width: min(46rem, calc(100% - 2rem)); margin: 2rem auto; }
  h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); }
  h2 { margin: 0 0 1rem; font-size: 1.2rem; }
  .panel { background: white; padding: 1.25rem; border: 1px solid #c7d3e3; border-radius: 12px; margin: 1rem 0; }
  form { display: grid; gap: .8rem; }
  label { display: grid; gap: .25rem; font-weight: 600; }
  input, button, select { font: inherit; border: 1px solid #74839b; border-radius: 6px; padding: .5rem .65rem; color: inherit; background: white; }
  button { cursor: pointer; }
  button.primary { color: white; background: #2449a0; border-color: #2449a0; }
  :focus-visible { outline: 3px solid #c06b03; outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  .toolbar { justify-content: space-between; }
  .toolbar label { display: flex; align-items: center; gap: .5rem; }
  ul { padding: 0; list-style: none; }
  li { padding: .8rem 0; border-bottom: 1px solid #dae2ec; overflow-wrap: anywhere; }
  li h3 { margin: 0; }
  li p { margin: .2rem 0 .6rem; }
  #feedback { min-height: 1.5em; }
  #feedback[data-error] { color: #9e2424; }
</style>
</head>
<body>
<main>
  <h1>Мої завдання</h1>
  <p>Student Task Manager</p>

  <section class="panel" aria-labelledby="form-title">
    <h2 id="form-title">Нове завдання</h2>
    <form id="task-form" novalidate>
      <label>Назва <input name="title" required maxlength="120"></label>
      <label>Дисципліна <input name="subject" required maxlength="100"></label>
      <label>Дата здачі <input name="due" type="date" required></label>
      <div class="row">
        <button id="save" class="primary">Додати завдання</button>
        <button id="cancel" type="button" hidden>Скасувати</button>
      </div>
    </form>
    <p id="feedback" role="status" aria-live="polite"></p>
  </section>

  <section class="panel" aria-labelledby="list-title">
    <div class="row toolbar">
      <h2 id="list-title">Список завдань</h2>
      <label>Показати <select id="filter">
        <option value="all">Усі</option>
        <option value="active">Активні</option>
        <option value="completed">Виконані</option>
      </select></label>
    </div>
    <p id="empty"></p>
    <ul id="tasks"></ul>
  </section>
</main>
<script>
const storageKey = "student-task-manager.tasks.v1";
const form = document.querySelector("#task-form");
const fields = form.elements;
const filter = document.querySelector("#filter");
const list = document.querySelector("#tasks");
const feedback = document.querySelector("#feedback");
const empty = document.querySelector("#empty");
const cancel = document.querySelector("#cancel");
let editingId = null;
let tasks = [];
let nextId = 1;

function announce(message, error = false) {
  feedback.textContent = message;
  feedback.toggleAttribute("data-error", error);
}

function storeTasks(updated) {
  try {
    localStorage.setItem(storageKey, JSON.stringify(updated));
  } catch {
    announce("Не вдалося зберегти завдання в браузері.", true);
    return false;
  }
  tasks = updated;
  render();
  return true;
}

function resetForm() {
  editingId = null;
  form.reset();
  document.querySelector("#form-title").textContent = "Нове завдання";
  document.querySelector("#save").textContent = "Додати завдання";
  cancel.hidden = true;
}

function edit(task) {
  editingId = task.id;
  fields.title.value = task.title;
  fields.subject.value = task.subject;
  fields.due.value = task.due;
  document.querySelector("#form-title").textContent = "Редагування завдання";
  document.querySelector("#save").textContent = "Зберегти зміни";
  cancel.hidden = false;
  announce("Редагується «" + task.title + "».");
  fields.title.focus();
}

function addAction(container, label, action) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.addEventListener("click", action);
  container.append(button);
}

function render() {
  const mode = filter.value;
  const visible = tasks.filter(task => mode === "all" || task.completed === (mode === "completed"));
  empty.textContent = visible.length ? "" : tasks.length ? "За цим фільтром завдань немає." : "Завдань поки немає.";
  list.replaceChildren();
  for (const task of visible) {
    const row = document.createElement("li");
    const title = document.createElement("h3");
    const details = document.createElement("p");
    const actions = document.createElement("div");
    title.textContent = task.title;
    details.textContent = [task.subject, task.due, task.completed ? "Виконано" : "Активне"].join(" · ");
    actions.className = "row";
    addAction(actions, "Редагувати", () => edit(task));
    addAction(actions, task.completed ? "Повернути до активних" : "Позначити виконаним", () => {
      const updated = tasks.map(item => item.id === task.id ? {...item, completed: !item.completed} : item);
      if (storeTasks(updated)) announce(task.completed ? "Завдання повернено до активних." : "Завдання позначено виконаним.");
    });
    addAction(actions, "Видалити", () => {
      if (storeTasks(tasks.filter(item => item.id !== task.id))) {
        if (editingId === task.id) resetForm();
        announce("Завдання видалено.");
      }
    });
    row.append(title, details, actions);
    list.append(row);
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const title = fields.title.value.trim();
  const subject = fields.subject.value.trim();
  const due = fields.due.value;
  const invalid = !title ? fields.title : !subject ? fields.subject : !due || !fields.due.validity.valid ? fields.due : null;
  if (invalid) {
    const messages = {title: "Введіть назву завдання.", subject: "Введіть дисципліну.", due: "Укажіть допустиму дату здачі."};
    announce(messages[invalid.name], true);
    invalid.focus();
    return;
  }

  const creating = editingId === null;
  const data = {title, subject, due};
  const updated = creating
    ? [...tasks, {id: nextId, ...data, completed: false}]
    : tasks.map(task => task.id === editingId ? {...task, ...data} : task);
  if (!storeTasks(updated)) return;
  if (creating) {
    nextId += 1;
    filter.value = "all";
    render();
  }
  resetForm();
  announce(creating ? "Завдання додано." : "Зміни збережено.");
});

cancel.addEventListener("click", () => {
  resetForm();
  announce("Редагування скасовано.");
});
filter.addEventListener("change", render);

try {
  const saved = JSON.parse(localStorage.getItem(storageKey) ?? "[]");
  if (!Array.isArray(saved)) throw new Error("Invalid task list");
  tasks = saved;
  nextId = tasks.reduce((maximum, task) => Math.max(maximum, task.id), 0) + 1;
} catch {
  announce("Не вдалося прочитати збережений список завдань.", true);
}
render();
</script>
</body>
</html>
